<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>도이의 야매 토끼 잡기 게임</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; font-family: 'Pretendard', sans-serif;
      background: #f0f4f8; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
    }
    #game-container {
      width: 100%; max-width: 480px; height: 100vh; max-height: 840px;
      background: #ffffff; position: relative; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column;
    }
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; background: white; z-index: 10;
    }
    .hidden { display: none !important; }
    h1 { color: #333; margin-bottom: 15px; font-size: 26px; text-align: center; }
    p { color: #666; font-size: 14px; text-align: center; margin-bottom: 20px; line-height: 1.5; }
    input {
      width: 80%; padding: 15px; font-size: 18px; border: 2px solid #ddd;
      border-radius: 12px; text-align: center; margin-bottom: 20px; outline: none;
    }
    input:focus { border-color: #ff4757; }
    button {
      width: 80%; padding: 15px; font-size: 18px; font-weight: bold;
      color: white; background: #ff4757; border: none; border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
    }
    button:active { transform: scale(0.96); }
    #header {
      height: 60px; background: #2ed573; color: white; display: flex;
      justify-content: space-between; align-items: center; padding: 0 20px;
      font-size: 18px; font-weight: bold; z-index: 5;
    }
    #play-area { flex: 1; position: relative; background: #f8f9fa; overflow: hidden; }
    .rabbit {
      position: absolute; width: 65px; height: 65px;
      background-image: url('rabbit.png'); background-size: contain;
      background-repeat: no-repeat; cursor: pointer; touch-action: manipulation;
    }
    .score-popup {
      position: absolute; font-weight: bold; font-size: 22px; pointer-events: none;
      animation: floatUp 0.5s ease-out forwards; z-index: 8;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
    .ranking-box {
      width: 90%; max-height: 220px; overflow-y: auto; border: 1px solid #eee;
      border-radius: 10px; padding: 10px; margin-bottom: 20px; background: #fafafa;
    }
    .ranking-item { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 15px; }
    .ranking-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; color: #ff4757; width: 30px; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="start-screen" class="screen">
    <h1>🐰 스피드 토끼 잡기!</h1>
    <p>더 빨라진 토끼를 잡아보세요!<br><b>느림: 5점 | 보통: 10점 | 광속: 20점</b></p>
    <input type="text" id="nickname-input" placeholder="닉네임 입력" maxlength="8">
    <button id="start-btn">게임 시작</button>
  </div>

  <div id="header">
    <div>점수: <span id="score-display">0</span></div>
    <div>남은시간: <span id="time-display">30</span>s</div>
  </div>
  <div id="play-area"></div>

  <div id="game-over-screen" class="screen hidden">
    <h1>게임 종료!</h1>
    <p><span id="player-name-display"></span>님의 점수: <b id="final-score" style="font-size: 24px; color: #ff4757;">0</b>점</p>
    
    <h3>🏆 실시간 전체 랭킹 🏆</h3>
    <div class="ranking-box" id="ranking-list">랭킹 불러오는 중...</div>

    <button id="restart-btn">다시 하기</button>
  </div>
</div>

<script>
  // 💥 [중요] 본인의 JSONBin 정보로 변경하세요 💥
  const BIN_ID = '6a6ae6cada38895dfea2caff'; 
  const MASTER_KEY = '$2a$10$bk2FsAR8hnd5lXGET6KmJ.fSYoollsOnUeisHNr6RrINPNvVutUX6'; 

  let score = 0;
  let timeLeft = 30;
  let timer = null;
  let spawnInterval = null;
  let nickname = '';

  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const nicknameInput = document.getElementById('nickname-input');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreDisplay = document.getElementById('score-display');
  const timeDisplay = document.getElementById('time-display');
  const playArea = document.getElementById('play-area');
  const finalScore = document.getElementById('final-score');
  const playerNameDisplay = document.getElementById('player-name-display');
  const rankingList = document.getElementById('ranking-list');

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  });

  function startGame() {
    nickname = nicknameInput.value.trim();
    if (!nickname) {
      alert('닉네임을 입력해주세요!');
      return;
    }

    score = 0;
    timeLeft = 30;
    scoreDisplay.textContent = score;
    timeDisplay.textContent = timeLeft;
    playArea.innerHTML = '';

    startScreen.classList.add('hidden');

    timer = setInterval(() => {
      timeLeft--;
      timeDisplay.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    // ⚡ 생성 속도 단축 (기존 0.6초 -> 0.4초마다 등장)
    spawnInterval = setInterval(spawnRabbit, 400);
  }

  function spawnRabbit() {
    const rabbit = document.createElement('div');
    rabbit.classList.add('rabbit');

    const areaWidth = playArea.clientWidth - 65;
    const areaHeight = playArea.clientHeight - 65;

    rabbit.style.left = `${Math.random() * areaWidth}px`;
    rabbit.style.top = `${Math.random() * areaHeight}px`;

    const typeRand = Math.random();
    let speed, points, color;

    // ⚡ 이동/소멸 속도 더욱 가속!
    if (typeRand < 0.25) { 
      speed = 0.45; // 0.45초 만에 사라지는 광속 토끼 (20점)
      points = 20; 
      color = '#ff4757'; 
    } else if (typeRand < 0.65) { 
      speed = 0.8;  // 보통 (10점)
      points = 10; 
      color = '#ffa502'; 
    } else { 
      speed = 1.2;  // 느림 (5점)
      points = 5; 
      color = '#2ed573'; 
    }

    playArea.appendChild(rabbit);

    const removeTimeout = setTimeout(() => {
      if (rabbit.parentNode) rabbit.remove();
    }, speed * 1000);

    rabbit.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      score += points;
      scoreDisplay.textContent = score;

      showPopup(e.clientX, e.clientY, `+${points}`, color);

      clearTimeout(removeTimeout);
      rabbit.remove();
    });
  }

  function showPopup(x, y, text, color) {
    const rect = playArea.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.classList.add('score-popup');
    popup.textContent = text;
    popup.style.color = color;
    popup.style.left = `${x - rect.left}px`;
    popup.style.top = `${y - rect.top}px`;

    playArea.appendChild(popup);
    setTimeout(() => popup.remove(), 500);
  }

  async function endGame() {
    clearInterval(timer);
    clearInterval(spawnInterval);
    playArea.innerHTML = '';

    finalScore.textContent = score;
    playerNameDisplay.textContent = nickname;

    gameOverScreen.classList.remove('hidden');
    rankingList.innerHTML = '랭킹 동기화 중...';

    await updateGlobalRanking(nickname, score);
  }

  // 🌐 서버 전역 랭킹 불러오기 & 업데이트
  async function updateGlobalRanking(name, newScore) {
    try {
      // 1. 현재 서버 저장 데이터 가져오기
      const getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': MASTER_KEY }
      });
      const getData = await getRes.json();
      let rankings = getData.record || [];

      // 2. 새 점수 반영 후 상위 10개 정렬
      rankings.push({ name, score: newScore });
      rankings.sort((a, b) => b.score - a.score);
      rankings = rankings.slice(0, 10);

      // 3. 서버에 수정된 랭킹 다시 저장
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(rankings)
      });

      // 4. 화면 출력
      renderRanking(rankings);

    } catch (err) {
      console.error(err);
      rankingList.innerHTML = '랭킹 불러오기 실패 😢';
    }
  }

  function renderRanking(rankings) {
    rankingList.innerHTML = rankings.map((item, index) => `
      <div class="ranking-item">
        <span class="rank-num">${index + 1}위</span>
        <span>${item.name}</span>
        <b>${item.score}점</b>
      </div>
    `).join('');
  }
</script>
</body>
</html>
