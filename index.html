<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>도이의 야매 토끼 잡기 게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 840px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    /* 화면 공통 */
    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: white;
      z-index: 10;
    }
    .hidden { display: none !important; }

    h1 { color: #333; margin-bottom: 20px; font-size: 28px; text-align: center; }
    p { color: #666; font-size: 15px; text-align: center; margin-bottom: 20px; line-height: 1.5; }

    input {
      width: 80%;
      padding: 15px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      outline: none;
    }
    input:focus { border-color: #ff4757; }

    button {
      width: 80%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #ff4757;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }

    /* 헤더 (점수 & 시간) */
    #header {
      height: 60px;
      background: #2ed573;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 18px;
      font-weight: bold;
      z-index: 5;
    }

    /* 게임 영역 */
    #play-area {
      flex: 1;
      position: relative;
      background: #f8f9fa;
      overflow: hidden;
    }

    /* 토끼 캐릭터 */
    .rabbit {
      position: absolute;
      width: 70px;
      height: 70px;
      background-image: url('rabbit.png');
      background-size: contain;
      background-repeat: no-repeat;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 점수 팝업 텍스트 */
    .score-popup {
      position: absolute;
      font-weight: bold;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 8;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    /* 랭킹 리스트 */
    .ranking-box {
      width: 90%;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 20px;
      background: #fafafa;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }
    .ranking-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; color: #ff4757; width: 30px; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 시작 화면 -->
  <div id="start-screen" class="screen">
    <h1>🐰 토끼 잡기 게임!</h1>
    <p>빠르게 움직이는 토끼일수록 고득점!<br><b>느림: 5점 | 보통: 10점 | 빠름: 20점</b></p>
    <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="8">
    <button id="start-btn">게임 시작</button>
  </div>

  <!-- 게임 실행 화면 -->
  <div id="header">
    <div>점수: <span id="score-display">0</span></div>
    <div>남은시간: <span id="time-display">30</span>s</div>
  </div>
  <div id="play-area"></div>

  <!-- 결과/랭킹 화면 -->
  <div id="game-over-screen" class="screen hidden">
    <h1>게임 종료!</h1>
    <p><span id="player-name-display"></span>님의 최종 점수: <b id="final-score" style="font-size: 24px; color: #ff4757;">0</b>점</p>
    
    <h3>🏆 명예의 전당 🏆</h3>
    <div class="ranking-box" id="ranking-list"></div>

    <button id="restart-btn">다시 하기</button>
  </div>
</div>

<script>
  let score = 0;
  let timeLeft = 30;
  let timer = null;
  let spawnInterval = null;
  let nickname = '';

  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const nicknameInput = document.getElementById('nickname-input');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreDisplay = document.getElementById('score-display');
  const timeDisplay = document.getElementById('time-display');
  const playArea = document.getElementById('play-area');
  const finalScore = document.getElementById('final-score');
  const playerNameDisplay = document.getElementById('player-name-display');
  const rankingList = document.getElementById('ranking-list');

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', () => {
    gameOverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
  });

  function startGame() {
    nickname = nicknameInput.value.trim();
    if (!nickname) {
      alert('닉네임을 입력해주세요!');
      return;
    }

    score = 0;
    timeLeft = 30;
    scoreDisplay.textContent = score;
    timeDisplay.textContent = timeLeft;
    playArea.innerHTML = '';

    startScreen.classList.add('hidden');

    // 타이머 시작
    timer = setInterval(() => {
      timeLeft--;
      timeDisplay.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    // 토끼 생성 (0.6초마다)
    spawnInterval = setInterval(spawnRabbit, 600);
  }

  function spawnRabbit() {
    const rabbit = document.createElement('div');
    rabbit.classList.add('rabbit');

    // 영역 크기 계산
    const areaWidth = playArea.clientWidth - 70;
    const areaHeight = playArea.clientHeight - 70;

    const startX = Math.random() * areaWidth;
    const startY = Math.random() * areaHeight;
    rabbit.style.left = `${startX}px`;
    rabbit.style.top = `${startY}px`;

    // 속도 유형 설정 (5점, 10점, 20점)
    const typeRand = Math.random();
    let speed, points, color;

    if (typeRand < 0.2) { 
      // 빠름 (20점) - 20% 확률
      speed = 0.8; 
      points = 20; 
      color = '#ff4757'; 
    } else if (typeRand < 0.6) { 
      // 보통 (10점) - 40% 확률
      speed = 1.4; 
      points = 10; 
      color = '#ffa502'; 
    } else { 
      // 느림 (5점) - 40% 확률
      speed = 2.2; 
      points = 5; 
      color = '#2ed573'; 
    }

    playArea.appendChild(rabbit);

    // 제한 시간 후 사라짐
    const removeTimeout = setTimeout(() => {
      if (rabbit.parentNode) rabbit.remove();
    }, speed * 1000);

    // 토끼 터치/클릭 이벤트
    rabbit.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      score += points;
      scoreDisplay.textContent = score;

      showPopup(e.clientX || startX, e.clientY || startY, `+${points}`, color);

      clearTimeout(removeTimeout);
      rabbit.remove();
    });
  }

  function showPopup(x, y, text, color) {
    const rect = playArea.getBoundingClientRect();
    const popup = document.createElement('div');
    popup.classList.add('score-popup');
    popup.textContent = text;
    popup.style.color = color;
    popup.style.left = `${x - rect.left}px`;
    popup.style.top = `${y - rect.top}px`;

    playArea.appendChild(popup);
    setTimeout(() => popup.remove(), 600);
  }

  function endGame() {
    clearInterval(timer);
    clearInterval(spawnInterval);
    playArea.innerHTML = '';

    finalScore.textContent = score;
    playerNameDisplay.textContent = nickname;

    saveAndDisplayRanking(nickname, score);
    gameOverScreen.classList.remove('hidden');
  }

  function saveAndDisplayRanking(name, score) {
    let rankings = JSON.parse(localStorage.getItem('rabbit_rankings') || '[]');
    rankings.push({ name, score });
    rankings.sort((a, b) => b.score - a.score);
    rankings = rankings.slice(0, 10); // 상위 10개만 저장

    localStorage.setItem('rabbit_rankings', JSON.stringify(rankings));

    rankingList.innerHTML = rankings.map((item, index) => `
      <div class="ranking-item">
        <span class="rank-num">${index + 1}위</span>
        <span>${item.name}</span>
        <b>${item.score}점</b>
      </div>
    `).join('');
  }
</script>
</body>
</html>
